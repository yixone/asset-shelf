[workspace]
resolver = "2"
members = [
    "crates/models",
    "crates/mimetype",
    "crates/flake_id",
    "crates/db",
    "crates/storage",
    "crates/storage_backend",
]

[workspace.dependencies]
# Workspace crates
db = { path = "crates/db" }
models = { path = "crates/models" }
mimetype = { path = "crates/mimetype" }
flake_id = { path = "crates/flake_id" }
storage = { path = "crates/storage" }
storage_backend = { path = "crates/storage_backend" }

# External crates
async-trait = "0.1.89"
bytes = "1.11.1"
chrono = "0.4.42"
rand = "0.10.1"
serde = "1.0.219"
sqlx = "0.8.5"
tokio = "1.47.1"
tokio-util = "0.7.16"
