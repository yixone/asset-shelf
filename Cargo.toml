[workspace]
resolver = "2"
members = [
    "crates/base62",
    "crates/snowflake",
    "crates/schema",
    "crates/mimetype",
]

[workspace.dependencies]
# --- Workspace crates ---

# Snowflake id generator
snowflake.path = "crates/snowflake"

# Mimetype types and detector 
mimetype.path = "crates/mimetype"

# Domain types and structures used in the application
schema.path = "crates/schema"


# Base62 encoder/decoder
base62.path = "crates/base62"

# --- Extern crates ---
chrono = "0.4.42"
rand = "0.10.1"
