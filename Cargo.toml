[workspace]
resolver = "2"
members = [
    "crates/base62",
    "crates/fs-sys",
    "crates/mime",
    "crates/schema",
    "crates/snowflake",
    "crates/storage",
]

[workspace.dependencies]
# --- Workspace crates ---

# Base62 encoder/decoder
base62.path = "crates/base62"
# Low-level cross-platform file system APIs
fs-sys.path = "crates/fs-sys"
# MIME types and detector 
mime.path = "crates/mime"
# Domain types and structures used in the application
schema.path = "crates/schema"
# Snowflake id generator
snowflake.path = "crates/snowflake"


# --- Extern crates ---
chrono = "0.4.42"
rand = "0.10.1"
serde = "1.0.219"
sqlx = "0.8.5"

# --- FFI / System ---
libc = "0.2.189"
winapi = "0.3.9"
