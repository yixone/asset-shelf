[workspace]
resolver = "2"
members = [
    "crates/db",
    "crates/flake_id",
    "crates/media",
    "crates/mimetype",
    "crates/models",
]

[workspace.dependencies]
# Workspace crates
db = { path = "crates/db" }
flake_id = { path = "crates/flake_id" }
media = { path = "crates/media" }
mimetype = { path = "crates/mimetype" }
models = { path = "crates/models" }

# External crates
bytes = "1.11.1"
chrono = "0.4.42"
image = "0.25.10"
rand = "0.10.1"
serde = "1.0.219"
sqlx = "0.8.5"
tokio = "1.47.1"
tokio-util = "0.7.16"
