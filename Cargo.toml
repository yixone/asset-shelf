[workspace]
resolver = "2"
members = [
    "crates/backup",
    # Application crates
    "crates/config",
    "crates/db",
    "crates/db-core",
    "crates/db-sqlite",
    "crates/events",
    "crates/flake-id",
    "crates/fs",
    "crates/jobs",
    "crates/jobs-runtime",
    "crates/media",
    "crates/mimetype",
    "crates/models",
    "crates/result",
    "crates/storage",
    "crates/telemetry",

    # Binary crates
    "server",
]

[workspace.dependencies]
# Workspace crates
backup = { path = "crates/backup" }
config = { path = "crates/config" }
db = { path = "crates/db" }
db-core = { path = "crates/db-core" }
db-sqlite = { path = "crates/db-sqlite" }
events = { path = "crates/events" }
flake-id = { path = "crates/flake-id" }
jobs = { path = "crates/jobs" }
jobs-runtime = { path = "crates/jobs-runtime" }
media = { path = "crates/media" }
mimetype = { path = "crates/mimetype" }
models = { path = "crates/models" }
result = { path = "crates/result" }
storage = { path = "crates/storage" }
telemetry = { path = "crates/telemetry" }

# External crates
actix-cors = "0.7.1"
actix-multipart = "0.7.2"
actix-web = "4.11.0"
async-trait = "0.1.89"
bytes = "1.11.1"
cassette = { git = "https://github.com/yixone/cassette", branch = "master" }
chrono = "0.4.42"
futures = "0.3.32"
image = { version = "0.25.10", default-features = false }
prometheus = "0.14.0"
rand = "0.10.1"
serde = "1.0.219"
sqlx = "0.8.5"
tempfile = "3.27.0"
tokio = "1.47.1"
tokio-util = "0.7.16"
toml = "1.1.4"
tracing = "0.1.40"
tracing-subscriber = "0.3.18"
webp = "0.3.1"

# FFI / System
libc = "0.2.189"
winapi = "0.3.9"
