[workspace]
resolver = "2"
members = [
    "lib/base62",
    "lib/mime",

    "crates/models",
    "crates/snowflake",
    "crates/storage",
    "crates/storage-types",
]

[workspace.dependencies]
# --- Workspace crates ---

# Base62 encoder/decoder
base62.path = "lib/base62"
# MIME types and detector 
mime.path = "lib/mime"

# Domain types and structures used in the application
models.path = "crates/models"
# Snowflake id generator
snowflake.path = "crates/snowflake"

# Managed file storage for AssetShelf
storage.path = "crates/storage"
# Value types used by the managed file storage subsystem
storage-types.path = "crates/storage-types"


# --- Extern crates ---
async-trait = "0.1.89"
bytes = "1.11.1"
chrono = "0.4.42"
futures = "0.3.32"
rand = "0.10.1"
serde = "1.0.219"
sqlx = "0.8.5"
tempfile = "3.27.0"
tokio = "1.47.1"
tokio-util = "0.7.16"
tracing = "0.1.40"
tracing-subscriber = "0.3.18"

# --- FFI / System ---
libc = "0.2.189"
winapi = "0.3.9"
