[workspace]
resolver = "2"
members = [
    # Application core crates
    "crates/core/db",
    "crates/core/media",
    "crates/core/models",
    "crates/core/result",
    "crates/core/storage",
    "crates/core/storage_backend",

    # Common crates
    "crates/libs/flake_id",
    "crates/libs/mimetype",

    # Binary crates
    "crates/server",
    "crates/workers",
]

[workspace.dependencies]
# Workspace crates
db = { path = "crates/core/db" }
media = { path = "crates/core/media" }
models = { path = "crates/core/models" }
result = { path = "crates/core/result" }
storage = { path = "crates/core/storage" }
storage_backend = { path = "crates/core/storage_backend" }

flake_id = { path = "crates/libs/flake_id" }
mimetype = { path = "crates/libs/mimetype" }

workers = { path = "crates/workers" }

# External crates
actix-cors = "0.7.1"
actix-multipart = "0.7.2"
actix-web = "4.11.0"
async-trait = "0.1.89"
bytes = "1.11.1"
chrono = "0.4.42"
futures = "0.3.32"
image = "0.25.10"
rand = "0.10.1"
serde = "1.0.219"
sqlx = "0.8.5"
tempfile = "3.27.0"
tokio = "1.47.1"
tokio-util = "0.7.16"
tracing = "0.1.40"
tracing-subscriber = "0.3.18"
